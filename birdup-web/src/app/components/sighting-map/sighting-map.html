<mgl-map
  [mapStyle]="mapTilesUrl"
  [zoom]="4"
  [center]="mapCenter"
  [canvasContextAttributes]="{preserveDrawingBuffer: true}"
>
  <mgl-marker
    [lngLat]="mapCenter"
    [draggable]="true"
    (markerDragEnd)="onDragEnd($event)"
  />

  @if (sightingsCollection(); as sightings) {
    <mgl-geojson-source
      id="sightings"
      [data]="sightings"
      [cluster]="true"
      [clusterMaxZoom]="14"
      [clusterRadius]="30"
    />
      <mgl-layer
        id="clusters"
        type="circle"
        source="sightings"
        [filter]="['has', 'point_count']"
        [paint]="{
              'circle-color': {
                property: 'point_count',
                type: 'interval',
                stops: [
                  [0, '#51bbd6'],
                  [10, '#f1f075'],
                  [25, '#f28cb1']
                ]
              },
              'circle-radius': {
                property: 'point_count',
                type: 'interval',
                stops: [
                  [0, 20],
                  [100, 30],
                  [750, 40]
                ]
              }
            }"
        (layerMouseOver)="onMouseOver($event)"
        (layerMouseLeave)="onMouseLeave()"
      />

      @if (selectedElement() && selectedLngLat()) {
        <mgl-popup [lngLat]="selectedLngLat()" [closeOnMove]="true">
          @let clusterId = selectedElement()['cluster_id'];
        </mgl-popup>
      }

      <mgl-layer
        id="cluster-count"
        type="symbol"
        source="sightings"
        [filter]="['has', 'point_count']"
        [layout]="{
              'text-field': '{point_count_abbreviated}',
              'text-size': 12
            }"
      />
      <mgl-layer
        id="unclustered-point"
        type="circle"
        source="sightings"
        [filter]="['!has', 'point_count']"
        [paint]="{
              'circle-color': '#11b4da',
              'circle-radius': 4,
              'circle-stroke-width': 1,
              'circle-stroke-color': '#fff'
            }"
      />
     <mgl-control
      mglNavigation
      [visualizePitch]="true"
    />
  }
</mgl-map>

<form>
  <div
    tuiGroup
    class="sighting-map-group"
  >

    <div>
      <tui-icon icon="@tui.locate"/>
      <tui-textfield
      >
        <input
          name="coord-search"
          placeholder="Coordinates (Lat, Lng)"
          [ngModel]="coordinates()"
          (ngModelChange)="coordinates.set($event)"
        />
      </tui-textfield>
    </div>
  </div>
</form>
