<h2
  class="search-results-label"
  tuiTitle
>Results: {{ regionCode() }}
  <button
    tuiButton
    size="s"
    type="button"
  >
    <tui-icon icon="@tui.plus"/>
    Follow Region
  </button>
</h2>

<section class="sighting-results-grid">
  @for (sighting of results(); track $index) {
  <app-sighting-card [sighting]="sighting" />
}
</section>
