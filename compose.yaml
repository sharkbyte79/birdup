name: birdup_dev
services:
  # api:
  #   build:
  #     context: .
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     - POSTGRES_URL=jdbc:postgresql://db:5432/birdup

  web-prod:
    build:
      context: ./birdup-web/
      dockerfile: birdup-web/Dockerfile
    ports:
      - "6060:6060"
    profiles: ["prod"]

  web-dev:
    container_name: web
    build:
      context: ./birdup-web/
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    develop:
      watch:
        - action: sync
          path: ./birdup-web/
          target: /app
    profiles: ["dev"]

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    extra_hosts:
      - "host.docker.internal:host-gateway" # delete this after writing service/dockerfile for api
#    depends_on:

  db:
    image: postgres:latest
    container_name: db
    environment:
      POSTGRES_USER: birdup
      POSTGRES_PASSWORD: password
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "birdup" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    command: start-dev
    ports:
      - "5050:8080"

networks:
  db:
    driver: bridge

volumes:
  db:
